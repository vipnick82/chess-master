<link rel="apple-touch-startup-image" href="icons/launch-414x896@2x.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<style>
/* page frame: the same reset the Claude page gets, plus app-like touch behaviour */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;overscroll-behavior-y:none}
img{max-width:100%}
</style>
<title>Chess Master</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a dark club room. A fixed left rail with bright, filled icons (a bottom tab bar on phones);
   training opens full screen with the board as the hero and one dark sidebar beside it.
   Chunky 3D buttons, warm charcoal surfaces, board green as the signature colour. One dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#312e2b; --bg-deep:#262421; --surface:#262421; --surface-2:#3a3835; --surface-3:#4a4744; --sunk:#1d1c1a; --line:#3a3733;
  --ink:#ffffff; --ink-2:#dedcd8; --muted:#a3a09b; --faint:#77736e;
  --accent:#81b64c; --accent-hover:#98ca62; --accent-sh:#457536; --accent-ink:#ffffff; --accent-soft:rgba(129,182,76,.18);
  --gold:#f5bf3c; --gold-soft:rgba(245,191,60,.16); --orange:#f2962b; --blue:#4c9be6; --purple:#a27be6; --teal:#2fbfae; --red:#e6533c; --pink:#ea6aa8;
  --good:#81b64c; --good-soft:rgba(129,182,76,.18); --bad:#ee5d47; --bad-soft:rgba(238,93,71,.17); --warn:#f2a93b; --warn-soft:rgba(242,169,59,.17);
  --btn-sh:#1a1917; --shadow:0 3px 0 rgba(0,0,0,.28);
  --sq-l:#ebecd0; --sq-d:#739552; --sq-sel:rgba(255,255,51,.5); --sq-last:rgba(255,255,51,.42);
  --f-display:"Montserrat","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:12px; --r-sm:9px; --rail:214px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink-2);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{color:var(--ink);margin:0;text-wrap:balance}
h1{font:800 1.85rem/1.15 var(--f-display);letter-spacing:-.02em}
h2{font:800 1.2rem/1.25 var(--f-display);letter-spacing:-.01em}
h3{font:600 1.05rem/1.35 var(--f-body)}
p{margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.num{font:800 1.55rem/1.1 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;min-width:0}
.grow{flex:1;min-width:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* ---------- shell: rail and tab bar ---------- */
.rail{position:fixed;inset:0 auto 0 0;width:var(--rail);display:flex;flex-direction:column;gap:2px;padding:18px 10px;padding-left:max(10px,env(safe-area-inset-left,0px));z-index:20;background:var(--bg-deep)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;color:var(--ink);font:900 1.15rem/1 var(--f-display);letter-spacing:-.03em}
.brand svg{width:36px;height:36px;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--ink);font:700 1rem var(--f-body);position:relative}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.1)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.nav svg{width:32px;height:32px;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:.72rem;font-weight:700;padding:1px 8px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.navlink{margin-top:auto;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:600}
.navlink:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.navlink svg{width:24px;height:24px;margin-left:4px;margin-right:4px}
.sync{font-size:.74rem;color:var(--faint);padding:8px 12px}
.shell{margin-left:var(--rail)}
main{max-width:1120px;margin:0 auto;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
body.focus .rail{display:none}
body.focus .shell{margin-left:0}
body.focus main{max-width:1200px;padding-top:0}
@media (max-width:820px){
  .rail{inset:auto 0 0 0;width:auto;flex-direction:row;padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));box-shadow:0 -1px 0 rgba(0,0,0,.45)}
  .brand,.sync,.navlink{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;padding:6px 2px 4px;font-size:.66rem;font-weight:600;color:var(--muted);flex:1;text-align:center;border-radius:12px}
  .nav a[aria-current="page"]{background:transparent;color:var(--ink)}
  .nav a[aria-current="page"]::before{left:30%;right:30%;top:-6px;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  .nav svg{width:28px;height:28px}
  .nav .badge{position:absolute;top:2px;left:calc(50% + 8px);margin:0;font-size:.62rem;padding:0 6px}
  .shell{margin-left:0}
  main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body.focus main{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.5rem}
}

/* ---------- focus top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px;margin-bottom:6px}
.iconbtn{width:44px;height:44px;border-radius:10px;border:0;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none;box-shadow:0 3px 0 var(--btn-sh);transition:background .12s}
.iconbtn:hover{background:var(--surface-3)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-sh)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.topbar .ttl{font:800 1.05rem var(--f-display);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pbar{flex:1;height:14px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:60px;box-shadow:inset 0 2px 0 rgba(0,0,0,.35)}
.pbar>i{display:block;height:100%;width:0;border-radius:99px;transition:width .4s ease;background:linear-gradient(#a6d872,#73a83f);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),inset 0 3px 0 rgba(255,255,255,.25)}
.pcount{font:700 .88rem var(--f-mono);color:var(--muted);min-width:3.2em;text-align:right}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:10px;border:0;background:var(--surface-2);color:var(--ink);font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--btn-sh);transition:background .12s,transform .06s;text-align:center;position:relative}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-sh)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-sh);text-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.primary:active{box-shadow:0 2px 0 var(--accent-sh)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.btn.ghost.sm,.btn.ghost:active{box-shadow:none}
.btn.big{min-height:60px;font:800 1.12rem var(--f-display);padding-inline:28px;border-radius:12px}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.88rem;border-radius:9px;box-shadow:0 3px 0 var(--btn-sh)}
.btn.primary.sm{box-shadow:0 3px 0 var(--accent-sh)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border-radius:var(--r);padding:20px;min-width:0;box-shadow:var(--shadow)}
.click{cursor:pointer;transition:background .15s,transform .15s}
.click:hover{background:#2d2b28;transform:translateY(-2px)}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.section-head h2{display:flex;align-items:center;gap:10px}
.shic{width:30px;height:30px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chip.good{background:var(--good-soft);color:#a5d672}
.chip.bad{background:var(--bad-soft);color:#ff8c78}
.chip.warn{background:var(--warn-soft);color:#ffc169}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(#a6d872,#73a83f)}
.status{padding:12px 14px;border-radius:10px;font-weight:600;line-height:1.45;background:var(--surface-2);color:var(--ink-2)}
.status.good{background:var(--good-soft);color:#b4e07f}
.status.bad{background:var(--bad-soft);color:#ff9a87}
.status.warn{background:var(--warn-soft);color:#ffc977}
.empty{padding:30px 20px;text-align:center;color:var(--muted)}
.divider{height:1px;background:var(--line);border:0;margin:0}
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;color:var(--ink)}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";color:var(--muted);font-size:1.4rem;font-weight:400}
details[open]>summary::after{content:"−"}
select,input[type=text],textarea{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;max-width:100%;color:var(--ink)}
textarea{width:100%;resize:vertical;min-height:90px;font-family:var(--f-mono);font-size:.85rem}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:.82rem;color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink);box-shadow:0 2px 0 var(--btn-sh)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.switch input{appearance:none;width:50px;height:30px;border-radius:99px;background:var(--sunk);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0;box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}

/* app-icon tiles: white glyph on a bright gradient square */
.tico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 3px 0 rgba(0,0,0,.25)}
.tico svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.tico.sm{width:38px;height:38px;border-radius:11px}
.g-green{background:linear-gradient(160deg,#9ccd63,#5e9433)} .g-orange{background:linear-gradient(160deg,#f8b04a,#e27a17)} .g-blue{background:linear-gradient(160deg,#68b2f2,#2f74c6)}
.g-purple{background:linear-gradient(160deg,#b995f2,#7a52cf)} .g-red{background:linear-gradient(160deg,#f5775f,#cc3a26)} .g-teal{background:linear-gradient(160deg,#45d3c1,#178f81)}
.g-gold{background:linear-gradient(160deg,#ffd166,#e39b12)} .g-pink{background:linear-gradient(160deg,#f68cbd,#cf4686)} .g-gray{background:linear-gradient(160deg,#6d6a66,#4a4744)}

/* ---------- home ---------- */
.homehead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.homehead>.stack{flex:1 1 200px;min-width:0}
.avatar{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;flex:none;font:900 1.5rem var(--f-display);color:#fff;background:linear-gradient(160deg,#9ccd63,#5e9433);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 3px 0 rgba(0,0,0,.3)}
.hstats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.hstat{display:flex;align-items:center;gap:8px;background:var(--surface);border:0;border-radius:12px;padding:8px 14px 8px 10px;color:inherit;font:inherit;box-shadow:var(--shadow);text-align:left}
button.hstat{cursor:pointer} button.hstat:hover{background:#2d2b28}
.hstat svg.fi{width:28px;height:28px;flex:none}
.hstat b{font:800 1.05rem var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.hstat small{display:block;font-size:.7rem;color:var(--muted);line-height:1.2;font-weight:600}
.hstat .bar{height:6px;margin-top:4px;width:96px}
.hstats .gear{display:none}
.homegrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.homecol{display:flex;flex-direction:column;gap:16px;min-width:0}
.qtiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.homegrid{grid-template-columns:minmax(0,1fr)}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:26px;border-radius:16px;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,rgba(129,182,76,.35),transparent 55%),linear-gradient(160deg,#2f2d2a,#252320);box-shadow:var(--shadow)}
.hero h2{font:800 1.5rem/1.2 var(--f-display);letter-spacing:-.02em}
.plan{display:flex;flex-direction:column;gap:9px;margin-top:2px}
.plan div{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--ink-2)}
.plan i{width:24px;height:24px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff}
.plan i svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ring{width:118px;height:118px;flex:none}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding:22px}.hero .ring{position:absolute;right:14px;top:14px;width:70px;height:70px}.hero h2{padding-right:70px}}
.daily{display:flex;flex-direction:column;gap:12px}
.daily .board{border-radius:8px;box-shadow:0 6px 18px -6px rgba(0,0,0,.6)}
.daily .mini{width:100%;max-width:340px;margin:0 auto}
.qtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.qtiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qtile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:14px;background:var(--surface);border:0;cursor:pointer;text-align:left;color:var(--ink-2);box-shadow:0 4px 0 rgba(0,0,0,.3);transition:background .15s,transform .12s;min-width:0}
.qtile:hover{background:#2d2b28;transform:translateY(-2px)}
.qtile:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.qtile strong{font:800 1rem var(--f-display);color:var(--ink)}
.qtile small{color:var(--muted);font-size:.8rem;line-height:1.3}
.gridc{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.tipcard{display:flex;gap:14px;align-items:flex-start}
.onb{display:grid;gap:10px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.74rem;font-weight:700;color:var(--muted)}
.wd i{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:#fff;box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
.wd i svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.wd.on i{background:linear-gradient(#ffb547,#f07f1a);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.wd.today span{color:var(--ink)}
.wd.today i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold)}
.wd.future i{background:transparent;border:2px dashed var(--line);box-shadow:none}

/* ---------- learn ---------- */
.unitcard{padding:0;overflow:hidden}
.unit-top{display:flex;align-items:center;gap:14px;padding:18px 20px;background:linear-gradient(90deg,rgba(255,255,255,.05),transparent)}
.unit-top h2{font-size:1.15rem}
.unit-list{display:flex;flex-direction:column;padding:6px 10px 12px}
.lrow{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:10px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;color:var(--ink-2);position:relative}
.lrow:hover{background:rgba(255,255,255,.05)}
.lrow.next{background:var(--accent-soft)}
.lrow .t{font-weight:700;color:var(--ink)}
.lrow .s{font-size:.84rem;color:var(--muted)}
.ldot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:var(--surface-2);font:800 .85rem var(--f-display);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.ldot svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.ldot.done{background:linear-gradient(#9ccd63,#5e9433)}
.ldot.next{background:linear-gradient(#ffd166,#e39b12);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,191,60,.5)}50%{box-shadow:0 0 0 7px rgba(245,191,60,0)}}
.stars{display:inline-flex;gap:1px;color:var(--gold);font-size:.95rem;letter-spacing:1px;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.stars .off{color:#4a4744}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ccard{display:flex;flex-direction:column;align-items:stretch;text-align:left;cursor:pointer;color:var(--ink-2);padding:0;overflow:hidden;border:0}
.ccover{height:96px;display:grid;place-items:center;position:relative;overflow:hidden}
.ccover::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(255,255,255,.08) 90deg,transparent 0 180deg,rgba(255,255,255,.08) 0 270deg,transparent 0) 0 0/32px 32px}
.ccover svg{width:64px;height:64px;position:relative;z-index:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.cbody{display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px}
.cbody strong{font:800 1.02rem var(--f-display);color:var(--ink)}
.cicon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.cicon svg{width:66%;height:66%}
.cicon.xl{width:86px;height:86px;border-radius:20px}
.ci-bulb{background:linear-gradient(160deg,#ffc35a,#e98b16)} .ci-tower{background:linear-gradient(160deg,#f2735f,#c43b28)} .ci-wheel{background:linear-gradient(160deg,#b28cf0,#6f48c6)}
.ci-sword{background:linear-gradient(160deg,#46d1bf,#168a7c)} .ci-shield{background:linear-gradient(160deg,#69b3f3,#2c6fc0)} .ci-crown{background:linear-gradient(160deg,#a4d36c,#5a8f30)}
.side-pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted)}
.pawn-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid #8b8883}
.pawn-dot.w{background:#f6f5f0} .pawn-dot.b{background:#1b1d1c} .pawn-dot.both{background:linear-gradient(90deg,#f6f5f0 50%,#1b1d1c 50%)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.reptiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.reptile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--surface-2);border:2px solid transparent;cursor:pointer;text-align:left;color:var(--ink);box-shadow:0 3px 0 var(--btn-sh)}
.reptile:hover{background:var(--surface-3)}
.reptile[aria-pressed="true"]{border-color:var(--accent);background:rgba(129,182,76,.12)}
.reptile b{display:block;font-weight:700}
.reptile small{display:block;color:var(--muted);font-size:.8rem}
.reptile .pc{position:relative;inset:auto;width:44px;height:44px;flex:none;display:block}

/* ---------- train hub ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.tile2{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--surface);border:0;cursor:pointer;text-align:left;color:var(--ink-2);box-shadow:0 4px 0 rgba(0,0,0,.3);transition:background .15s,transform .12s;min-width:0}
.tile2:hover{background:#2d2b28;transform:translateY(-2px)}
.tile2:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.tile2 strong{display:block;font:800 1.02rem var(--f-display);color:var(--ink)}
.tile2 small{display:block;color:var(--muted);font-size:.82rem;line-height:1.35}
.tstat{margin-left:auto;text-align:right;flex:none}
.tstat b{display:block;font:800 1.2rem var(--f-display);color:var(--ink)}
.tstat small{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em}
.chev{width:20px;height:20px;flex:none;color:var(--faint);fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.themelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tbtn{display:flex;flex-direction:column;gap:7px;padding:12px 14px;border-radius:12px;border:0;background:var(--surface);cursor:pointer;color:var(--ink);text-align:left;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.tbtn:hover{background:#2d2b28}
.tbtn .row{justify-content:space-between;flex-wrap:nowrap}
.tbtn small{color:var(--muted);font-weight:600;font-family:var(--f-mono);font-size:.78rem}
.tbtn .bar{height:6px}

/* ---------- training layout: board + one sidebar ---------- */
.train{display:grid;grid-template-columns:minmax(0,auto) minmax(300px,390px);gap:22px;align-items:start;justify-content:center}
.bcol{display:flex;flex-direction:column;gap:10px;width:min(640px,calc(100vw - 480px),calc(100vh - 116px));min-width:min(320px,100%)}
.panel{display:flex;flex-direction:column;min-width:0;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.panel>.pcard,.panel>.card,.panel>div>.pcard{background:transparent;border-radius:0;box-shadow:none;border-top:1px solid var(--line)}
.panel>:first-child{border-top:0!important}
.panel>.stack{gap:0}
.panel>.stack>.pcard{border-top:1px solid var(--line)}
.panel>.stack:empty{display:none}
.pcard{background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.phead{display:flex;align-items:center;gap:12px;margin:-18px -18px 2px;padding:16px 18px;background:#3a3835;transition:background .25s}
.phead .pico{width:44px;height:44px;flex:none;border-radius:10px;background:rgba(0,0,0,.18);position:relative}
.phead .pico .pc{position:absolute;inset:3px}
.phead b{display:block;font:800 1.15rem/1.2 var(--f-display);color:#fff}
.phead small{display:block;color:rgba(255,255,255,.75);font-size:.84rem;font-weight:500}
.phead.ok{background:linear-gradient(160deg,#8fc457,#5e9433)}
.phead.fail{background:linear-gradient(160deg,#ef6b55,#c13d2a)}
.prompt{display:flex;align-items:center;gap:10px;font:800 1.15rem/1.3 var(--f-display);color:var(--ink)}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid #8b8883;flex:none}
.dot.w{background:#f6f5f0} .dot.b{background:#1b1d1c}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.comment{font-size:1.02rem;line-height:1.6;color:var(--ink-2)}
.comment b{color:var(--ink)}
.pdots{display:flex;gap:5px;flex-wrap:wrap}
.pdots i{width:12px;height:12px;border-radius:50%;background:var(--sunk);box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
.pdots i.ok{background:var(--good)} .pdots i.bad{background:var(--bad)} .pdots i.cur{background:var(--gold)}
.moves{font-family:var(--f-mono);font-size:.9rem;display:grid;grid-template-columns:2.6em 1fr 1fr;gap:2px 6px;max-height:230px;overflow:auto;align-items:center}
.moves .n{color:var(--faint)}
.moves button,.moves span:not(.n){border:0;background:transparent;padding:4px 8px;border-radius:6px;cursor:pointer;font:inherit;font-weight:700;text-align:left;color:var(--ink)}
.moves button:hover{background:rgba(255,255,255,.07)}
.moves button.cur{background:rgba(255,255,255,.14)}
.moves .mk-inacc{color:var(--gold)!important} .moves .mk-mist{color:var(--warn)!important} .moves .mk-blun{color:var(--bad)!important} .moves .mk-miss{color:#c19cf5!important}
.quiz .opt{display:block;width:100%;text-align:left;margin-top:8px;padding:13px 15px;border:0;border-radius:10px;background:var(--surface-2);cursor:pointer;color:var(--ink);font-weight:600;box-shadow:0 3px 0 var(--btn-sh)}
.quiz .opt:hover{background:var(--surface-3)}
.quiz .opt.right{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-sh)}
.quiz .opt.wrong{background:var(--bad);color:#fff;box-shadow:0 3px 0 #8f2a1c}
.coach{white-space:pre-wrap;font-size:.95rem;line-height:1.6}
.player{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);font-size:.95rem}
.player .pav{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.player .pav svg{width:62%;height:62%;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.evalbar{height:10px;flex:1;border-radius:99px;background:#403d39;overflow:hidden}
.evalbar>i{display:block;height:100%;background:#f1efe8;transition:width .4s}
.timer{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.timer>i{display:block;height:100%;background:linear-gradient(#ffd166,#e39b12);transition:width 1s linear}
.lives{display:flex;gap:6px}
.lives i{width:16px;height:16px;border-radius:5px;background:var(--sunk)}
.lives i.x{background:var(--bad)}
@media (max-width:980px){
  .train{grid-template-columns:minmax(0,1fr);gap:14px;justify-content:stretch}
  .bcol{width:min(640px,100%);margin:0 auto}
  .panel{width:min(640px,100%);margin:0 auto}
}
.textstep{max-width:640px;margin:20px auto 0;display:flex;flex-direction:column;gap:18px}
.textstep .card{padding:28px}
.result{max-width:560px;margin:26px auto 0;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center}
.result .big:not(.btn){font:900 3rem/1 var(--f-display);color:var(--ink);letter-spacing:-.03em}
.result .stars{font-size:2.2rem;letter-spacing:6px}
.result .card{width:100%;text-align:left}
.rart{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 5px 0 rgba(0,0,0,.3);animation:pop .35s ease-out}
.rart svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}

/* ---------- board ---------- */
.board{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:6px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);box-shadow:0 10px 30px -10px rgba(0,0,0,.7)}
.sq{position:relative}
.sq.l{background:var(--sq-l)} .sq.d{background:var(--sq-d)}
.sq.last::after,.sq.sel::after,.sq.hint::after,.sq.badflash::after,.sq.check::after{content:"";position:absolute;inset:0;pointer-events:none}
.sq.last::after{background:var(--sq-last)}
.sq.sel::after{background:var(--sq-sel)}
.sq.hint::after{box-shadow:inset 0 0 0 5px #f5bf3c}
.sq.check::after{background:radial-gradient(circle,rgba(230,40,30,.95) 0,rgba(230,40,30,.5) 45%,transparent 72%)}
.sq.badflash::after{background:rgba(220,60,45,.6);animation:fade .7s forwards}
.sq.okflash::before{content:"";position:absolute;inset:0;background:rgba(90,200,110,.5);z-index:2;pointer-events:none;animation:fade .9s forwards}
@keyframes fade{to{opacity:0}}
.sq .dest{position:absolute;left:50%;top:50%;width:32%;height:32%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(0,0,0,.16);pointer-events:none;z-index:2}
.sq .dest.cap{width:96%;height:96%;background:transparent;border:6px solid rgba(0,0,0,.16)}
.coord{position:absolute;font:700 11px/1 var(--f-body);pointer-events:none;z-index:1}
.coord.f{right:4px;bottom:3px} .coord.r{left:4px;top:4px}
.sq.l .coord{color:var(--sq-d)} .sq.d .coord{color:var(--sq-l)}
.pc{position:absolute;inset:0;background-size:100% 100%;z-index:3;pointer-events:none;will-change:transform}
.dragghost{position:fixed;z-index:50;pointer-events:none;background-size:100% 100%;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.board svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.promo{position:absolute;inset:0;z-index:6;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;gap:6px}
.promo button{width:20%;aspect-ratio:1;border-radius:12px;border:0;background:var(--sq-l);cursor:pointer;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.mark-ok{position:absolute;z-index:7;width:34%;height:34%;right:-8%;top:-8%;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:clamp(10px,2.3vw,17px);pointer-events:none;animation:pop .25s ease-out;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.mark-ok.good{background:#5fa832} .mark-ok.bad{background:#df4a35}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.board.mini{pointer-events:none;box-shadow:0 6px 18px -6px rgba(0,0,0,.6)}
.board.mini .coord{display:none}

/* ---------- progress ---------- */
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .eyebrow{display:flex;align-items:center;gap:8px}
.spark{width:100%;height:44px;margin-top:4px;display:block}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:8px}
.days i{aspect-ratio:1;border-radius:4px;background:var(--sunk)}
.days i.on{background:linear-gradient(#ffb547,#f07f1a)}
.weak{display:flex;gap:14px;align-items:flex-start}
.weak .n{width:32px;height:32px;border-radius:10px;background:linear-gradient(160deg,#f5775f,#cc3a26);color:#fff;display:grid;place-items:center;font:800 .95rem var(--f-display);flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.trow{display:flex;align-items:center;gap:10px;padding:11px 13px;border:0;border-radius:10px;background:var(--surface-2);color:var(--ink);text-align:left;cursor:pointer;width:100%;font-weight:600}
.trow:hover{background:var(--surface-3)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:58px;height:58px;border-radius:12px;border:3px solid transparent;cursor:pointer;padding:0;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;box-shadow:0 3px 0 var(--btn-sh)}
.swatch[aria-pressed="true"]{border-color:var(--accent)}
.mbadge{display:inline-flex;align-items:center;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.mbadge.best,.mbadge.good{background:var(--good-soft);color:#a5d672}
.mbadge.inacc{background:var(--gold-soft);color:var(--gold)}
.mbadge.mist{background:var(--warn-soft);color:#ffb35c}
.mbadge.blun{background:var(--bad-soft);color:#ff8c78}
.mbadge.miss{background:rgba(162,123,230,.18);color:#c9a8f7}
.egraph{width:100%;height:84px;border-radius:8px;cursor:pointer;display:block}
.accrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.accbox{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}
.kmoment{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line);background:transparent;cursor:pointer;text-align:left;color:var(--ink-2);flex-wrap:wrap}
.kmoment:first-child{border-top:0}
.navrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.levelcard{display:flex;gap:18px;align-items:center;background:radial-gradient(100% 160% at 0% 0%,rgba(245,191,60,.18),transparent 60%),var(--surface)}
.medal{width:72px;height:72px;flex:none}
.bi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--sunk);color:var(--faint);flex:none}
.bi svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge-i{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 10px;border-radius:14px;background:rgba(255,255,255,.03);border:2px dashed var(--line);color:var(--muted);min-width:0}
.badge-i b{font-size:.88rem;color:var(--muted)} .badge-i small{font-size:.74rem;line-height:1.35}
.badge-i.got{border:0;background:var(--surface);box-shadow:var(--shadow)}
.badge-i.got .bi{background:linear-gradient(160deg,#ffd166,#e39b12);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 3px 0 rgba(0,0,0,.3)}
.badge-i.got b{color:var(--ink)}
@media (max-width:560px){.badges{grid-template-columns:repeat(3,minmax(0,1fr))}.badge-i{padding:10px 6px}.badge-i small{display:none}.badge-i b{font-size:.76rem}.badge-i .bi{width:38px;height:38px}}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.area{display:flex;flex-direction:column;gap:9px;padding:15px 16px;border-radius:14px;border:0;background:var(--surface);cursor:pointer;text-align:left;color:var(--ink);min-width:0;box-shadow:0 4px 0 rgba(0,0,0,.3);transition:background .15s,transform .12s}
.area:hover{background:#2d2b28;transform:translateY(-2px)}
.area.low{box-shadow:0 0 0 2px var(--bad),0 4px 0 rgba(0,0,0,.3)}
.area .row{flex-wrap:nowrap}

/* ---------- settings ---------- */
.pieceset{display:flex;gap:10px;flex-wrap:wrap}
.psw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;border:3px solid transparent;background:var(--surface-2);cursor:pointer;color:var(--ink-2);box-shadow:0 3px 0 var(--btn-sh)}
.psw[aria-pressed="true"]{border-color:var(--accent)}
.psw .pv{display:flex;gap:2px;background:var(--sq-l);border-radius:8px;padding:2px}
.psw .pv i{position:relative;display:block;width:36px;height:36px;inset:auto}
.psw small{font-size:.74rem;font-weight:700}

/* ---------- toasts, confetti, keyboard ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#fff;color:#1d1c1a;font-weight:800;padding:10px 18px;border-radius:99px;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:pop .25s ease-out;white-space:nowrap}
.toast.xp{background:var(--accent);color:#fff;font-size:.9rem;padding:6px 14px;box-shadow:0 3px 0 var(--accent-sh)}
.toast.level,.toast.badge{background:linear-gradient(#ffd166,#f0a81e);color:#3b2604;box-shadow:0 4px 0 #a86f0a}
.toast.out{opacity:0;transform:translateY(8px);transition:all .35s}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:70}
.board:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sq.kcur::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 4px #3d8bfd;z-index:5;pointer-events:none}
.board:not(:focus-visible) .sq.kcur::before{display:none}

/* ---------- coach ---------- */
.coachb{display:flex;gap:12px;align-items:flex-start}
.cav{width:46px;height:46px;flex:none;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.cav svg{width:100%;height:100%;display:block}
.cav.sm{width:30px;height:30px}
.say{position:relative;flex:1;min-width:0;background:#ffffff;color:#22201d;border-radius:4px 16px 16px 16px;padding:11px 14px;font-weight:500;line-height:1.5;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.say::before{content:"";position:absolute;left:-7px;top:0;border-width:0 8px 10px 0;border-style:solid;border-color:transparent #fff transparent transparent}
.say .cbadge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:#fff;font:900 .74rem var(--f-display);margin-right:8px;vertical-align:-4px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.say.good .cbadge{background:#6aa83a} .say.warn .cbadge{background:#e9a422} .say.bad .cbadge{background:#df4a35}
.pcard.walk{box-shadow:inset 0 3px 0 var(--accent)}
.pcard.tip{box-shadow:inset 4px 0 0 var(--gold)}
.think{display:flex;flex-direction:column;gap:10px}
.tq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tqb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:10px;border:2px dashed #55524e;background:transparent;cursor:pointer;color:var(--ink);min-width:0}
.tqb small{color:var(--muted);font-size:.74rem;line-height:1.3}
.tqb:hover{border-color:var(--accent)}
.tqb.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
